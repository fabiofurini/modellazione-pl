site_name: Modellazione PL · Fabio Furini
site_url: https://fabiofurini.github.io/modellazione-pl/
site_description: >-
  Modelli di programmazione lineare:
  dispensa, codice Python/Gurobi, dati e casi di studio.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/modellazione-pl
copyright: >-
  &copy; 2026 Fabio Furini — testi, figure e dati con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice Python con licenza
  <a href="https://github.com/fabiofurini/modellazione-pl/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/chart-line
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search
  - redirects:
      redirect_maps:
        strumenti.md: modellazione.md
        richiami.md: teoria-lp.md
        guida-gurobi.md: solver-lp.md

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — sito personale
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza Università di Roma
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/function-variant
      link: https://fabiofurini.github.io/analisi-matematica-1/
      name: Analisi Matematica 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/algebra-lineare/
      name: Algebra lineare
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algoritmi/
      name: Algoritmi
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/programmazione-lineare/
      name: Programmazione lineare
    - icon: material/dots-grid
      link: https://fabiofurini.github.io/programmazione-lineare-intera/
      name: Programmazione lineare intera
    - icon: material/vector-curve
      link: https://fabiofurini.github.io/ottimizzazione-convessa/
      name: Ottimizzazione convessa
    - icon: material/graph-outline
      link: https://fabiofurini.github.io/ottimizzazione-su-reti/
      name: Ottimizzazione su reti
    - icon: material/hexagon-multiple-outline
      link: https://fabiofurini.github.io/ottimizzazione-combinatoria/
      name: Problemi di ottimizzazione combinatoria
    - icon: material/table-large
      link: https://fabiofurini.github.io/programmazione-dinamica/
      name: Programmazione dinamica
    - icon: material/map-marker-path
      link: https://fabiofurini.github.io/algoritmi-euristici/
      name: Algoritmi euristici
    - icon: material/approximately-equal
      link: https://fabiofurini.github.io/algoritmi-di-approssimazione/
      name: Algoritmi di approssimazione
    - icon: material/chart-bell-curve-cumulative
      link: https://fabiofurini.github.io/modellazione-pnl/
      name: Modellazione PNL
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/modellazione-mip/
      name: Modellazione MIP
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-pl/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/lp-modelling/
      lang: en

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=d0b005ece4
  # laboratorio interattivo (genera_laboratorio.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=d4d7e13ccc
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=4f68d7e6a2
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # laboratorio interattivo (genera_laboratorio.py): JSXGraph, il motore, gli helper comuni, i dati, poi le ricette
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=a67c342fc6
  - javascripts/gi-comune.js?v=74d7bb93a0
  - javascripts/gi-ott.js?v=04048d2032
  - javascripts/gi-pl-dati.js?v=ed0ce3f444
  - javascripts/gi-pl-modelli.js?v=2fadd486f6
  - javascripts/gi-pl-app.js?v=2e7a5d06b3
  - javascripts/gi-pl-finanza.js?v=4c08497cfc
  - javascripts/gi-pl-tecniche.js?v=af6b4e223c
  - javascripts/gi-pl-trasporto.js?v=6db229e339
  - javascripts/quiz.js?v=be7fae2b85

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /laboratorio/*.md
  !/laboratorio/index.md

nav:
  - Home: index.md
  - Modellazione:
      - modellazione.md
      - 1. Introduzione alla modellazione PL: introduzione.md
      - "2. Richiami: PL e analisi di sensitività": teoria-lp.md
      - "3. Il solver: costruire, risolvere, interpretare": solver-lp.md
      - 4. Tecniche di modellazione:
          - Panoramica: tecniche.md
          - 4.1 Dalla descrizione al modello: tecniche-01.md
          - 4.2 Pianificazione della produzione: tecniche-02.md
          - 4.3 Miscelazione: tecniche-03.md
          - 4.4 Trasporto: tecniche-04.md
          - 4.5 Pianificazione su più periodi: tecniche-05.md
          - 4.6 Min-max e max-min: tecniche-06.md
          - 4.7 Valori assoluti: tecniche-07.md
          - 4.8 Rapporti e percentuali: tecniche-08.md
          - 4.9 Che cosa non si può modellare: tecniche-09.md
          - Modelli svolti:
              - "Esempio 4.4 — Produzione in orario ordinario e in straordinario": tecniche-modelli-01.md
              - "Esempio 4.5 — Trasporto dai magazzini ai clienti": tecniche-modelli-02.md
              - "Esempio 4.6 — Pianificazione della dieta": tecniche-modelli-03.md
              - "Esempio 4.7 — Pianificazione della dieta per più classi": tecniche-modelli-04.md
              - "Esempio 4.8 — Produzione su più periodi con acquisti e stoccaggio": tecniche-modelli-05.md
              - "Esempio 4.9 — Scelta dei dolci": tecniche-modelli-06.md
              - "Esempio 4.10 — Produzione e stoccaggio di torte di frutta": tecniche-modelli-07.md
              - "Esempio 4.11 — Miscelazione di petrolio greggio in una raffineria": tecniche-modelli-08.md
              - "Esempio 4.12 — Produzione di tre farmaci": tecniche-modelli-09.md
  - Modelli deterministici:
      - modelli-deterministici.md
      - Produzione e scorte: produzione.md
      - Ricarica di veicoli elettrici: ricarica-ev.md
      - Data Envelopment Analysis: dea.md
  - Decisioni sotto incertezza:
      - decisioni-incertezza.md
      - Il Newsvendor: newsvendor.md
      - VaR e CVaR: var-cvar.md
      - Arbitraggio e prezzatura: arbitraggio.md
  - Ottimizzazione e machine learning:
      - ottimizzazione-ml.md
      - Regressione robusta e quantile: regressione.md
  - Esercizi: esercizi/index.md
  - Quiz: autovalutazione.md
  - Laboratorio: laboratorio/index.md
  - Materiale: materiale.md
  - Indice:
      - Programma: programma.md
      - Come si lavora con il corso: organizzazione.md
      - Notebook in Colab: notebook.md
